name: Job Data Synchronization Pipeline

# This workflow automatically synchronizes job vacancies
# from the Arbeitnow API into the production database.
#
# Triggers:
# 1. Scheduled execution every 6 hours
# 2. Manual execution from the GitHub Actions UI

on:
  # Automatic cron-based synchronization
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"

  # Allows manual execution via:
  # GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  sync-job-data:

    # GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    steps:

      # 1. Clone repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Python runtime
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

          # Built-in pip dependency cache
          # Speeds up future workflow runs
          cache: "pip"

      # 3. Install all project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Execute synchronization pipeline
      #
      # The sync script:
      # - Fetches vacancies from Arbeitnow API
      # - Detects new/existing/inactive jobs
      # - Updates lifecycle timestamps
      # - Stores data in Supabase PostgreSQL
      #
      # Environment variables are securely loaded
      # from GitHub Actions Secrets
      - name: Run Job Synchronization
        env:
          POSTGRES_DB_URL: ${{ secrets.POSTGRES_DB_URL }}
        run: |
          python run_sync.py

      # 5. Workflow completion summary
      # This step always executes even if previous steps fail
      - name: Synchronization Summary
        if: always()
        run: |
          echo "Job synchronization workflow completed."
